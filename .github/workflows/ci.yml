name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:
    workflow_dispatch:

jobs:
    build-and-test:
        name: Build & Test (.NET ${{ matrix.dotnet-version }} on ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest
                dotnet-version:
                    - '8.0.x'

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ matrix.dotnet-version }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Verify Code Formatting
              run: dotnet format --verify-no-changes --verbosity diagnostic

            - name: Build solution
              run: dotnet build --no-restore --configuration Release

            - name: Run tests
              run: dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"
